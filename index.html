<body>
  <div id="__bundler_placeholder">Loading The Exam Board…</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ax-width:640px){.page{padding:16px 20px 20px !important}}\n\n/* Top bar */\n.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 24px}\n.brand{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;min-width:0}\n.wordmark{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0;background:none;border:none;color:#F1FAF5;font:800 28px/1.1 'Rubik','Trebuchet MS',Arial,sans-serif;letter-spacing:-0.01em;cursor:pointer;text-align:left}\n.wordmark svg{flex:none}\n.chip{display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border-radius:999px;background:#FFD447;color:#18261F;font-size:15px;font-weight:600}\n.nav{display:flex;flex-wrap:wrap;gap:2px;margin:0 -12px}\n.navlink{min-height:44px;padding:0 12px;background:none;border:none;border-radius:999px;color:#F1FAF5;font:400 15px 'Rubik',Arial,sans-serif;cursor:pointer;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:5px;text-decoration-thickness:2px}\n.navlink:hover{text-decoration-color:currentColor}\n\n/* Buttons */\n.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;border-radius:999px;border:none;font:600 16px 'Rubik',Arial,sans-serif;cursor:pointer;text-align:center}\n.btn:active{transform:translateY(2px)}\n.btn-coral{background:#FF8A66;color:#18261F;font-weight:800;font-size:17px;min-height:52px;box-shadow:0 6px 0 #0A4433}\n.btn-ghost{background:none;color:#F1FAF5;border:2px solid #F1FAF5}\n.btn-dark{background:#18261F;color:#FFFDF6}\n.btn-yellow{background:#FFD447;color:#18261F;font-weight:800}\n\n/* Home */\n.home{display:flex;flex-direction:column;gap:64px;padding:8px 0 4px}\n.hero{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:24px 48px;padding-top:28px}\n.hero-text{flex:1 1 520px;max-width:700px;display:flex;flex-direction:column;gap:16px}\n.kicker{font-size:15px;font-weight:600;color:#FFD447;letter-spacing:0.02em}\n.hero-h{margin:0;font-size:clamp(42px,6vw,76px);line-height:0.95;font-weight:800;letter-spacing:-0.03em}\n.lead{margin:0;font-size:19px;line-height:1.5;max-width:60ch}\n.lead-2{margin:0;font-size:16px;line-height:1.55;color:#C6E6D8;max-width:62ch}\n.hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}\n.fan{position:relative;flex:0 1 460px;height:330px;min-width:320px}\n.fancard{position:absolute;left:50%;bottom:30px;width:150px;height:212px;margin-left:-75px;box-sizing:border-box;padding:14px;border-radius:16px;background:#FFFDF6;color:#18261F;box-shadow:0 6px 0 #0A4433;transform-origin:50% 100%;display:flex;flex-direction:column;gap:2px}\n.fan-short{font-size:19px;font-weight:800}\n.fan-long{font-size:12.5px;color:#4D5F56}\n.fan-pips{margin-top:auto;height:14px;background:radial-gradient(circle at 7px 7px,#FFD447 6px,rgba(0,0,0,0) 6.5px);background-size:18px 14px}\n.stamp{position:absolute;z-index:10;right:0;bottom:4px;transform:rotate(-8deg);padding:8px 16px;border:3px solid #FFD447;border-radius:12px;background:#0F5B45;color:#FFD447;font-weight:800;font-size:21px;letter-spacing:0.06em;text-transform:uppercase}\n@media (max-width:760px){.fan{display:none}.hero{padding-top:12px}}\n.anchor{scroll-margin-top:16px}\n.sec-head{display:flex;flex-direction:column;gap:6px;margin-bottom:20px}\n.sec-h{margin:0;font-size:32px;line-height:1.1;font-weight:800;letter-spacing:-0.01em}\n.sec-sub{margin:0;font-size:16px;line-height:1.5;color:#C6E6D8;max-width:72ch}\n.steplist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(270px,100%),1fr));gap:16px}\n.step{display:flex;gap:14px;align-items:flex-start;background:#0A4433;border-radius:16px;padding:18px 20px}\n.stepnum{flex:none;width:36px;height:36px;border-radius:50%;background:#FFD447;color:#18261F;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}\n.step h3{margin:4px 0 6px;font-size:18px;font-weight:600}\n.step p{margin:0;font-size:15px;line-height:1.5}\n.scengrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:18px;align-items:stretch}\n.scard{display:flex;flex-direction:column;align-items:flex-start;gap:6px;box-sizing:border-box;min-height:200px;padding:20px 20px 18px;border:none;border-radius:18px;background:#FFFDF6;color:#18261F;box-shadow:0 6px 0 #0A4433;font-family:'Rubik',Arial,sans-serif;text-align:left;cursor:pointer;transition:transform .15s ease}\n.scard:hover{transform:translateY(-3px)}\n.scard-h{display:block;font-size:22px;line-height:1.15;font-weight:800;letter-spacing:-0.01em}\n.scard-meta{display:block;font-size:14px;color:#4D5F56}\n.scard-p{display:block;margin-top:6px;font-size:15px;line-height:1.45}\n.scard-go{margin-top:auto;padding-top:14px;font-size:15px;font-weight:600;color:#0F5B45}\n.scard-sb{background:none;color:#F1FAF5;border:2px dashed #8CCBB1;box-shadow:none}\n.scard-sb .scard-meta{color:#C6E6D8}\n.scard-sb .scard-go{color:#FFD447}\n@media (prefers-reduced-motion:reduce){.scard{transition:none}.scard:hover{transform:none}.btn:active{transform:none}}\n\n/* About */\n.about-grid{display:flex;flex-wrap:wrap;gap:28px 48px;align-items:flex-start}\n.prose{flex:1 1 520px;max-width:72ch;display:flex;flex-direction:column;gap:12px}\n.prose p{margin:0;font-size:16px;line-height:1.6}\n.prose h3{margin:18px 0 0;font-size:20px;font-weight:600}\n.compwrap{container-type:inline-size}\n.compgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));align-items:stretch;gap:14px}\n.abil-list{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:10px 24px}\n.abil-list dt{font-weight:600;color:#FFD447;font-size:15.5px}\n.abil-list dd{margin:3px 0 0;font-size:15px;line-height:1.5}\n.bands{margin:0;padding:12px 16px;list-style:none;display:flex;flex-direction:column;gap:6px;background:#0A4433;border-radius:14px}\n.bands li{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:15px;line-height:1.45}\n.band-name{font-weight:600;min-width:210px}\n.criteria{flex:1 1 320px;max-width:460px;box-sizing:border-box;background:#0A4433;border-radius:20px;padding:20px 22px;display:flex;flex-direction:column;gap:14px}\n.criteria h3{margin:0;font-size:18px;font-weight:600}\n.crit-list{margin:0;display:flex;flex-direction:column;gap:12px}\n.crit-list dt{font-weight:600;color:#FFD447;font-size:15.5px}\n.crit-list dd{margin:3px 0 0;font-size:14.5px;line-height:1.5}\n.formula{padding:12px 14px;border-radius:12px;background:#0F5B45;font-size:16px;font-weight:600;line-height:1.7}\n.formula sup{font-size:11.5px;font-weight:600}\n.formula-note{margin:-4px 0 0;font-size:13.5px;line-height:1.45;color:#C6E6D8}\n.sub-h{margin:0 0 14px;font-size:24px;font-weight:800;letter-spacing:-0.01em}\n.credits{margin-top:44px}\n.credit-list{margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:14px}\n.credit-list div{background:#FFFDF6;color:#18261F;border-radius:14px;padding:14px 16px;box-shadow:0 6px 0 #0A4433}\n.credit-list dt{font-size:12.5px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:#4D5F56}\n.credit-list dd{margin:5px 0 0;font-size:15px;line-height:1.45}\n.refs{margin-top:44px}\n.refs-note{margin:0 0 16px;font-size:15px;line-height:1.5;color:#C6E6D8;max-width:76ch}\n.refcols{columns:2 440px;column-gap:48px}\n.refgroup-h{margin:22px 0 10px;font-size:15px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:#FFD447;break-after:avoid}\n.refcols > .refgroup-h:first-child{margin-top:0}\n.reflist{margin:0;padding:0;list-style:none}\n.reflist li{break-inside:avoid;margin:0 0 14px;padding-left:1.4em;text-indent:-1.4em;font-size:14.5px;line-height:1.5}\n.reflist strong{font-weight:600}\n.reflinks a{margin-right:12px;overflow-wrap:anywhere;font-weight:600}\n.refuse{display:block;text-indent:0;margin-top:3px;font-size:13.5px;line-height:1.45;color:#C6E6D8}\n.estlist{margin:0;padding-left:20px;font-size:14.5px;line-height:1.6}\n.estlist li{break-inside:avoid}\n.foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 24px;border-top:1px solid #2E7A62;padding-top:14px;font-size:14px;color:#C6E6D8}\n.foot p{margin:0;max-width:84ch;line-height:1.5}\n\n/* Sandbox editor */\n.sbx{display:flex;flex-direction:column;gap:14px;padding:14px 0;border-top:1px solid #2E7A62;border-bottom:1px solid #2E7A62}\n.sbx-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px 24px}\n.sbx-intro{flex:1 1 480px;display:flex;flex-direction:column;gap:6px;max-width:80ch}\n.sbx-intro h2{margin:0;font-size:18px;font-weight:600}\n.sbx-intro p{margin:0;font-size:15.5px;line-height:1.5}\n.presets{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:14.5px;color:#C6E6D8}\n.preset{min-height:40px;padding:0 14px;border-radius:999px;border:2px solid #8CCBB1;background:none;color:#F1FAF5;font:400 14.5px 'Rubik',Arial,sans-serif;cursor:pointer}\n.preset:hover{background:#0A4433}\n.sbx-cols{display:flex;flex-wrap:wrap;gap:14px}\n.sbx-col{flex:1 1 300px;box-sizing:border-box;background:#0A4433;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}\n.sbx-col h3{margin:0;font-size:16px;font-weight:600}\n.sbx-hint{margin:0 0 6px;font-size:13.5px;line-height:1.4;color:#C6E6D8}\n.sbrow{display:flex;align-items:center;gap:8px;min-height:46px}\n.sblabel{flex:1;min-width:0;font-size:15px}\n.sbval{font-weight:600;font-variant-numeric:tabular-nums;font-size:15px;text-align:right;white-space:nowrap}\n.sbbar{display:block;width:56px;height:8px;flex:none;background:#0F5B45;border-radius:999px;overflow:hidden}\n.sbbar span{display:block;height:8px;background:#FFD447}\n.sbbtn{flex:none;width:44px;height:44px;border-radius:50%;border:none;font:800 21px/1 'Rubik',Arial,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}\n.sbminus{background:#E7EFEA;color:#18261F}\n.sbplus{background:#FFD447;color:#18261F}\n.sbbtn[aria-disabled=\"true\"]{opacity:0.3;cursor:not-allowed}\n.sbcycle{margin-top:6px;min-height:44px;padding:0 16px;border:none;border-radius:999px;background:#FFFDF6;color:#18261F;font:400 14.5px 'Rubik',Arial,sans-serif;cursor:pointer;text-align:left}\n.linkbtn{min-height:44px;padding:0;background:none;border:none;color:#FFD447;font:600 15px 'Rubik',Arial,sans-serif;text-decoration:underline;text-underline-offset:4px;cursor:pointer;align-self:flex-start}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div class=\"page\" style=\"min-height: 100vh; box-sizing: border-box; background: #0F5B45; color: #F1FAF5; font-family: 'Rubik', 'Trebuchet MS', Arial, sans-serif; padding: 26px clamp(20px, 5vw, 96px) 28px; display: flex; flex-direction: column; gap: 14px\" data-canvas-width=\"1366\" data-canvas-height=\"980\" data-document-role=\"page\" data-label=\"D · Card table\">\n\n  <header class=\"topbar\">\n    <div class=\"brand\">\n      <button type=\"button\" class=\"wordmark\" sc-camel-on-click=\"{{goHome}}\" aria-label=\"The Exam Board, home page\">\n        <svg aria-hidden=\"true\" width=\"34\" height=\"34\" sc-camel-view-box=\"0 0 64 64\"><rect width=\"64\" height=\"64\" rx=\"14\" fill=\"#0A4433\"><\u002Frect><rect x=\"12\" y=\"13\" width=\"26\" height=\"36\" rx=\"5\" fill=\"#FF8A66\" transform=\"rotate(-12 25 31)\"><\u002Frect><rect x=\"25\" y=\"14\" width=\"26\" height=\"36\" rx=\"5\" fill=\"#FFFDF6\" transform=\"rotate(8 38 32)\"><\u002Frect><path d=\"M31 33 L36 38 L45 27\" fill=\"none\" stroke=\"#0F5B45\" stroke-width=\"4.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" transform=\"rotate(8 38 32)\"><\u002Fpath><\u002Fsvg>\n        <span>The Exam Board<\u002Fspan>\n      <\u002Fbutton>\n      <sc-if value=\"{{inGame}}\">\n        <span class=\"chip\">{{chipText}}<\u002Fspan>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <nav class=\"nav\" aria-label=\"Site\">\n      <sc-for list=\"{{nav}}\" as=\"n\">\n        <button type=\"button\" class=\"navlink\" sc-camel-on-click=\"{{n.pick}}\">{{n.label}}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fnav>\n  <\u002Fheader>\n\n  <sc-if value=\"{{isHome}}\">\n  <main class=\"home\">\n\n    <section class=\"hero\" aria-labelledby=\"welcome-h\">\n      <div class=\"hero-text\">\n        <div class=\"kicker\">An assessment design game for medical educators<\u002Fdiv>\n        <h1 id=\"welcome-h\" class=\"hero-h\">Welcome to The Exam Board<\u002Fh1>\n        <p class=\"lead\">In 'The Exam Board', you are tasked with designing an assessment for medical learners. The brief tells you who the candidates are and what the assessment has to measure, and it sets limits on money, staff time and testing time. You design the assessment within those limits and then send it to an exam board, which decides whether to approve it.<\u002Fp>\n        <div class=\"hero-actions\">\n          <button type=\"button\" class=\"btn btn-coral\" sc-camel-on-click=\"{{goScenarios}}\">Choose a brief<\u002Fbutton>\n          <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{goAbout}}\">How the scoring works<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"fan\" aria-hidden=\"true\">\n        <sc-for list=\"{{fan}}\" as=\"f\">\n          <div class=\"fancard\" style=\"transform: translateX({{f.x}}) translateY({{f.y}}) rotate({{f.r}}); z-index: {{f.z}}\">\n            <div class=\"fan-short\">{{f.short}}<\u002Fdiv>\n            <div class=\"fan-long\">{{f.long}}<\u002Fdiv>\n            <div class=\"fan-pips\" style=\"width: {{f.pips}}\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div class=\"stamp\">Commended<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section aria-labelledby=\"how-h\">\n      <div class=\"sec-head\"><h2 id=\"how-h\" class=\"sec-h\">How the game works<\u002Fh2><\u002Fdiv>\n      <ol class=\"steplist\">\n        <li class=\"step\"><span class=\"stepnum\" aria-hidden=\"true\">1<\u002Fspan><div><h3>Choose a brief<\u002Fh3><p>Pick one of the three briefs below. If you would rather describe an assessment of your own, open the sandbox instead.<\u002Fp><\u002Fdiv><\u002Fli>\n        <li class=\"step\"><span class=\"stepnum\" aria-hidden=\"true\">2<\u002Fspan><div><h3>Build the assessment<\u002Fh3><p>Add components, such as a question paper or a viva, and decide how many of the marks each one carries. After each change the game updates the utility score, which rates the whole design out of 100, and shows the evidence for that change at the foot of the page.<\u002Fp><\u002Fdiv><\u002Fli>\n        <li class=\"step\"><span class=\"stepnum\" aria-hidden=\"true\">3<\u002Fspan><div><h3>Submit your design to the board<\u002Fh3><p>A psychometrician, a student representative, a finance lead and an external examiner comment on your design, and the board gives its verdict. The game may also pick an unexpected event at random, such as a budget cut or an appeal, and show how it changes the verdict.<\u002Fp><\u002Fdiv><\u002Fli>\n      <\u002Fol>\n    <\u002Fsection>\n\n    <section id=\"briefs\" class=\"anchor\" aria-labelledby=\"scen-h\">\n      <div class=\"sec-head\">\n        <h2 id=\"scen-h\" class=\"sec-h\">Choose a brief<\u002Fh2>\n        <p class=\"sec-sub\">The game keeps your design for each brief until you close or reload this page.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"scengrid\">\n        <sc-for list=\"{{scenarios}}\" as=\"c\">\n          <button type=\"button\" class=\"scard {{c.cls}}\" sc-camel-on-click=\"{{c.pick}}\">\n            <span class=\"scard-h\">{{c.title}}<\u002Fspan>\n            <span class=\"scard-p\">{{c.line}}<\u002Fspan>\n            <span class=\"scard-go\">{{c.action}} <span aria-hidden=\"true\">→<\u002Fspan><\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"about\" class=\"anchor\" aria-labelledby=\"about-h\">\n      <div class=\"sec-head\"><h2 id=\"about-h\" class=\"sec-h\">About<\u002Fh2><\u002Fdiv>\n      <div class=\"about-grid\">\n        <div class=\"prose\">\n          <p>The Exam Board is a teaching simulation for people who design or run assessments in medical education. It lets you try a design and see its consequences before you use it with real candidates.<\u002Fp>\n          <h3>How the model scores a design<\u002Fh3>\n          <p>The game uses the utility model of van der Vleuten (1996), which judges an assessment on five criteria: reliability, validity, educational impact, acceptability and cost-efficiency. The model gives each criterion a score between 0 and 1.<\u002Fp>\n          <p>The utility is the product of the five scores, each raised to a power set by its weight in the brief. Because the scores are multiplied, a very low score on one criterion lowers the utility however good the others are. The game shows the utility out of 100.<\u002Fp>\n          <h3>The four constructs<\u002Fh3>\n          <p>Validity depends on four constructs. A construct is a quality that an assessment sets out to measure. Each brief says how much of each construct it needs, and each component measures the constructs in different amounts. The amounts for each component are the model's own estimates.<\u002Fp>\n          <dl class=\"abil-list\">\n            <sc-for list=\"{{abilities}}\" as=\"k\"><div><dt>{{k.name}}<\u002Fdt><dd>{{k.text}}<\u002Fdd><\u002Fdiv><\u002Fsc-for>\n          <\u002Fdl>\n          <h3>How the board decides<\u002Fh3>\n          <p>A design must first meet every requirement of the brief. It must cost no more than the budget, keep within the testing time allowed, and reach the minimum reliability if the brief sets one. If it does not, the board refers it back. Otherwise the board compares its utility with the best utility that a computer search found for the same brief.<\u002Fp>\n          <ul class=\"bands\">\n            <sc-for list=\"{{bands}}\" as=\"b\"><li><span class=\"band-name\">{{b.name}}<\u002Fspan><span>{{b.rule}}<\u002Fspan><\u002Fli><\u002Fsc-for>\n          <\u002Ful>\n          <p>To show what the design means for candidates, the model simulates 4,000 candidates whose true competence is known and marks each of them with your design. The board reports how many would pass without being competent and how many competent candidates would fail.<\u002Fp>\n          <p>The first time a design for a brief meets every requirement, the game also picks one unexpected event at random. It might be a budget cut, a shortage of examiners, leaked questions, a report of an attainment gap, essays written by AI or an appeal. In the sandbox, events happen only if you set \"Unexpected events at the board\" to on.<\u002Fp>\n          <h3>Where the numbers come from<\u002Fh3>\n          <p>Reliabilities, times and costs come from published studies, from the Unit Costs of Health and Social Care 2025 published by the Personal Social Services Research Unit (PSSRU), and from university pay scales and marking tariffs. Where no source was found, the model uses an estimate, and the evidence note in the game says so.<\u002Fp>\n          <p>The scores are meant for teaching and for comparing one design with another. Judging a real assessment needs an analysis of its own results.<\u002Fp>\n        <\u002Fdiv>\n        <aside class=\"criteria\" aria-labelledby=\"crit-h\">\n          <h3 id=\"crit-h\">The five criteria<\u002Fh3>\n          <dl class=\"crit-list\">\n            <sc-for list=\"{{criteria}}\" as=\"k\"><div><dt>{{k.name}}<\u002Fdt><dd>{{k.text}}<\u002Fdd><\u002Fdiv><\u002Fsc-for>\n          <\u002Fdl>\n          <div class=\"formula\">Utility = 100 × R<sup>a<\u002Fsup> × V<sup>b<\u002Fsup> × E<sup>c<\u002Fsup> × A<sup>d<\u002Fsup> × C<sup>e<\u002Fsup><\u002Fdiv>\n          <p class=\"formula-note\">R, V, E, A and C are the five scores. The powers a to e are the brief's weights for each criterion, divided by the total of the weights.<\u002Fp>\n        <\u002Faside>\n      <\u002Fdiv>\n\n      <div id=\"credits\" class=\"anchor credits\">\n        <h3 class=\"sub-h\">Credits<\u002Fh3>\n        <dl class=\"credit-list\">\n          <sc-for list=\"{{credits}}\" as=\"c\"><div><dt>{{c.role}}<\u002Fdt><dd>{{c.text}}<\u002Fdd><\u002Fdiv><\u002Fsc-for>\n        <\u002Fdl>\n      <\u002Fdiv>\n\n      <div id=\"references\" class=\"anchor refs\">\n        <h3 class=\"sub-h\">References<\u002Fh3>\n        <p class=\"refs-note\">{{refsNote}}<\u002Fp>\n        <div class=\"refcols\">\n          <sc-for list=\"{{refGroups}}\" as=\"g\">\n            <h4 class=\"refgroup-h\">{{g.title}}<\u002Fh4>\n            <ul class=\"reflist\">\n              <sc-for list=\"{{g.refs}}\" as=\"r\"><li><strong>{{r.a}}<\u002Fstrong> {{r.b}}<em>{{r.j}}<\u002Fem>{{r.d}} <span class=\"reflinks\"><sc-for list=\"{{r.links}}\" as=\"l\"><a href=\"{{l.href}}\" target=\"_blank\" rel=\"noopener\" aria-label=\"{{l.aria}}\">{{l.label}}<\u002Fa><\u002Fsc-for><\u002Fspan><span class=\"refuse\">{{r.u}}<\u002Fspan><\u002Fli><\u002Fsc-for>\n            <\u002Ful>\n          <\u002Fsc-for>\n          <h4 class=\"refgroup-h\">Figures that are still estimates<\u002Fh4>\n          <p class=\"refs-note\" style=\"font-size: 14.5px; margin-bottom: 8px\">No source was found for the figures below, so the game labels them as estimates or assumptions.<\u002Fp>\n          <ul class=\"estlist\">\n            <sc-for list=\"{{estimates}}\" as=\"e\"><li>{{e}}<\u002Fli><\u002Fsc-for>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <footer class=\"foot\" style=\"justify-content: flex-end\">\n      <button type=\"button\" class=\"navlink\" style=\"margin: 0 -12px\" sc-camel-on-click=\"{{goTop}}\">Back to top<\u002Fbutton>\n    <\u002Ffooter>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{showEditor}}\">\n  <section class=\"sbx\" aria-labelledby=\"sbx-h\">\n    <div class=\"sbx-head\">\n      <div class=\"sbx-intro\">\n        <h2 id=\"sbx-h\">Sandbox: your own context<\u002Fh2>\n        <p>These controls describe the situation that your assessment is for. A change here updates the scores straight away and leaves your design as it is.<\u002Fp>\n      <\u002Fdiv>\n      <button type=\"button\" class=\"btn btn-ghost\" style=\"min-height: 44px; font-size: 15px\" sc-camel-on-click=\"{{closeEditor}}\">Hide this panel<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"presets\" role=\"group\" aria-label=\"Replace the values in this panel with those of a brief, or with the defaults\">\n      <span>Replace the values in this panel with those of a brief, or with the defaults:<\u002Fspan>\n      <sc-for list=\"{{sbPresets}}\" as=\"p\"><button type=\"button\" class=\"preset\" sc-camel-on-click=\"{{p.pick}}\">{{p.label}}<\u002Fbutton><\u002Fsc-for>\n    <\u002Fdiv>\n    <div class=\"sbx-cols\">\n      <div class=\"sbx-col\">\n        <h3>Candidates and limits<\u002Fh3>\n        <p class=\"sbx-hint\">The board checks every design against the budget, staff time, testing time and minimum reliability that you set here.<\u002Fp>\n        <sc-for list=\"{{sbContext}}\" as=\"r\">\n          <div class=\"sbrow\">\n            <span class=\"sblabel\">{{r.label}}<\u002Fspan>\n            <span class=\"sbval\">{{r.value}}<\u002Fspan>\n            <button type=\"button\" class=\"sbbtn sbminus\" sc-camel-on-click=\"{{r.dec}}\" aria-label=\"{{r.decLabel}}\" aria-disabled=\"{{r.atMin}}\">−<\u002Fbutton>\n            <button type=\"button\" class=\"sbbtn sbplus\" sc-camel-on-click=\"{{r.inc}}\" aria-label=\"{{r.incLabel}}\" aria-disabled=\"{{r.atMax}}\">+<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <sc-for list=\"{{sbCycles}}\" as=\"k\"><button type=\"button\" class=\"sbcycle\" sc-camel-on-click=\"{{k.pick}}\">{{k.label}}: <span style=\"font-weight: 600\">{{k.value}}<\u002Fspan><\u002Fbutton><\u002Fsc-for>\n      <\u002Fdiv>\n      <div class=\"sbx-col\">\n        <h3>What the assessment must measure<\u002Fh3>\n        <p class=\"sbx-hint\">Each row is a construct, a quality that the assessment sets out to measure. Press − or + to take away or add one point of emphasis, up to 10 points for each construct. The percentage shows each construct's points as a share of all the points, so a change to one row also changes the percentages in the other rows.<\u002Fp>\n        <sc-for list=\"{{sbMeasure}}\" as=\"r\">\n          <div class=\"sbrow\">\n            <span class=\"sblabel\"><span class=\"tip\"><button type=\"button\" class=\"tipbtn\" aria-describedby=\"{{r.tipId}}\">{{r.label}}<span aria-hidden=\"true\" class=\"tipq\">?<\u002Fspan><\u002Fbutton><span role=\"tooltip\" id=\"{{r.tipId}}\" class=\"tipbox\" style=\"background: #FFFDF6; color: #18261F\">{{r.tip}}<\u002Fspan><\u002Fspan><\u002Fspan>\n            <span class=\"sbbar\" aria-hidden=\"true\"><span style=\"width: {{r.value}}\"><\u002Fspan><\u002Fspan>\n            <span class=\"sbval\" style=\"min-width: 42px\">{{r.value}}<\u002Fspan>\n            <button type=\"button\" class=\"sbbtn sbminus\" sc-camel-on-click=\"{{r.dec}}\" aria-label=\"{{r.decLabel}}\" aria-disabled=\"{{r.atMin}}\">−<\u002Fbutton>\n            <button type=\"button\" class=\"sbbtn sbplus\" sc-camel-on-click=\"{{r.inc}}\" aria-label=\"{{r.incLabel}}\" aria-disabled=\"{{r.atMax}}\">+<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div class=\"sbx-col\">\n        <h3>How much each criterion matters<\u002Fh3>\n        <p class=\"sbx-hint\">Each criterion has a weight from 0 to 5. A higher weight gives the criterion more influence on the utility, and a weight of 0 leaves it out of the utility altogether.<\u002Fp>\n        <sc-for list=\"{{sbWeights}}\" as=\"r\">\n          <div class=\"sbrow\">\n            <span class=\"sblabel\">{{r.label}}<\u002Fspan>\n            <span class=\"sbval\">{{r.value}}<\u002Fspan>\n            <button type=\"button\" class=\"sbbtn sbminus\" sc-camel-on-click=\"{{r.dec}}\" aria-label=\"{{r.decLabel}}\" aria-disabled=\"{{r.atMin}}\">−<\u002Fbutton>\n            <button type=\"button\" class=\"sbbtn sbplus\" sc-camel-on-click=\"{{r.inc}}\" aria-label=\"{{r.incLabel}}\" aria-disabled=\"{{r.atMax}}\">+<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{showBriefing}}\">\n  <div style=\"display: flex; flex-wrap: wrap; align-items: flex-start; gap: 14px 48px; padding: 14px 0; border-top: 1px solid #2E7A62; border-bottom: 1px solid #2E7A62; position: relative\">\n    <div style=\"flex: 1 1 440px; max-width: 66ch; display: flex; flex-direction: column; gap: 6px\">\n      <h2 style=\"margin: 0; font-size: 18px; font-weight: 600\">{{briefingTitle}}<\u002Fh2>\n      <p style=\"margin: 0; font-size: 16px; line-height: 1.55\">{{purpose}}<\u002Fp>\n      <sc-if value=\"{{showSbEdit}}\"><button type=\"button\" class=\"linkbtn\" sc-camel-on-click=\"{{openEditor}}\">Show the context controls<\u002Fbutton><\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"flex: 0 1 400px; display: flex; flex-direction: column; gap: 4px; font-size: 15px\">\n      <sc-for list=\"{{facts}}\" as=\"f\" hint-placeholder-count=\"5\">\n        <div style=\"display: flex; gap: 14px\"><span style=\"width: 100px; flex: none; color: #C6E6D8\">{{f.label}}<\u002Fspan><span style=\"font-weight: 600; font-variant-numeric: tabular-nums\">{{f.value}}<\u002Fspan><\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"flex: 0 1 360px; display: flex; flex-direction: column; gap: 6px; font-size: 15px\">\n      <div style=\"color: #C6E6D8\">What the assessment must measure:<\u002Fdiv>\n      <sc-for list=\"{{measure}}\" as=\"m\" hint-placeholder-count=\"3\">\n        <div style=\"display: flex; align-items: center; gap: 10px\">\n          <span style=\"width: 190px; flex: none\"><span class=\"tip\"><button type=\"button\" class=\"tipbtn\" aria-describedby=\"{{m.tipId}}\">{{m.label}}<span aria-hidden=\"true\" class=\"tipq\">?<\u002Fspan><\u002Fbutton><span role=\"tooltip\" id=\"{{m.tipId}}\" class=\"tipbox\" style=\"background: #FFFDF6; color: #18261F\">{{m.tip}}<\u002Fspan><\u002Fspan><\u002Fspan>\n          <span style=\"width: 90px; height: 8px; flex: none; background: #0A4433; border-radius: 999px; overflow: hidden\"><span style=\"display: block; height: 8px; width: {{m.pct}}; background: #FFD447\"><\u002Fspan><\u002Fspan>\n          <span style=\"font-weight: 600; font-variant-numeric: tabular-nums\">{{m.pct}}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{isDesign}}\" hint-placeholder-val=\"{{false}}\">\n  <div style=\"flex: 1; display: flex; flex-direction: column; gap: 14px\">\n\n    <div style=\"flex: 1; display: flex; flex-wrap: wrap; gap: 20px 28px\">\n\n      <div class=\"compwrap\" style=\"flex: 999 1 600px; min-width: 0; display: flex; flex-direction: column; gap: 12px\">\n        <h2 style=\"margin: 0; font-size: 18px; font-weight: 600\">Components<\u002Fh2>\n        <sc-if value=\"{{blockedNotice}}\"><p style=\"margin: 0; font-size: 14.5px; line-height: 1.45; color: #C6E6D8; max-width: 90ch\">{{blockedNotice}}<\u002Fp><\u002Fsc-if>\n        <div class=\"compgrid\">\n          <sc-for list=\"{{slots}}\" as=\"c\" hint-placeholder-count=\"5\">\n            <div class=\"handcard\" style=\"display: flex; min-height: 320px\">\n              <sc-if value=\"{{c.used}}\" hint-placeholder-val=\"{{true}}\">\n                <div style=\"flex: 1; box-sizing: border-box; background: #FFFDF6; color: #18261F; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 6px 0 #0A4433\">\n                  <div style=\"display: flex; justify-content: space-between; align-items: flex-start; gap: 6px\">\n                  <div style=\"display: flex; flex-direction: column; gap: 1px\">\n                    <div style=\"font-size: 20px; font-weight: 800\">{{c.short}}<\u002Fdiv>\n                    <div style=\"font-size: 12.5px; color: #4D5F56\">{{c.long}}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <button type=\"button\" sc-camel-on-click=\"{{c.remove}}\" aria-label=\"{{c.removeLabel}}\" title=\"Remove\" style=\"flex: none; width: 36px; height: 36px; margin: -6px -6px 0 0; border-radius: 999px; background: none; color: #4D5F56; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center\"><svg aria-hidden=\"true\" width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 14 14\"><path d=\"M2 2 L12 12 M12 2 L2 12\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n                  <\u002Fdiv>\n                  <div style=\"display: flex; flex-direction: column; gap: 5px\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: baseline; gap: 8px\"><span style=\"font-size: 13.5px\">{{c.amountLabel}}<\u002Fspan><span style=\"font-size: 24px; line-height: 1; font-weight: 800; font-variant-numeric: tabular-nums\">{{c.value}}<\u002Fspan><\u002Fdiv>\n                    <div style=\"display: flex; gap: 6px\">\n                      <button type=\"button\" sc-camel-on-click=\"{{c.dec}}\" aria-label=\"{{c.decLabel}}\" style=\"flex: 1; height: 44px; border-radius: 999px; background: #E7EFEA; color: #18261F; border: none; font: 800 22px 'Rubik', Arial, sans-serif; cursor: pointer\">−<\u002Fbutton>\n                      <button type=\"button\" sc-camel-on-click=\"{{c.inc}}\" aria-label=\"{{c.incLabel}}\" style=\"flex: 1; height: 44px; border-radius: 999px; background: #18261F; color: #FFFDF6; border: none; font: 800 22px 'Rubik', Arial, sans-serif; cursor: pointer\">+<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display: flex; flex-direction: column; gap: 5px\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: baseline; gap: 8px\"><span style=\"font-size: 13.5px\">Share of marks<\u002Fspan><span style=\"font-size: 24px; line-height: 1; font-weight: 800; font-variant-numeric: tabular-nums\">{{c.share}}<\u002Fspan><\u002Fdiv>\n                    <div style=\"display: flex; gap: 6px\">\n                      <button type=\"button\" sc-camel-on-click=\"{{c.shareDec}}\" aria-label=\"{{c.shareDecLabel}}\" style=\"flex: 1; height: 44px; border-radius: 999px; background: #E7EFEA; color: #18261F; border: none; font: 800 22px 'Rubik', Arial, sans-serif; cursor: pointer\">−<\u002Fbutton>\n                      <button type=\"button\" sc-camel-on-click=\"{{c.shareInc}}\" aria-label=\"{{c.shareIncLabel}}\" style=\"flex: 1; height: 44px; border-radius: 999px; background: #18261F; color: #FFFDF6; border: none; font: 800 22px 'Rubik', Arial, sans-serif; cursor: pointer\">+<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{c.hasChips}}\" hint-placeholder-val=\"{{false}}\">\n                    <div style=\"display: flex; flex-direction: column; gap: 4px\">\n                      <sc-for list=\"{{c.chips}}\" as=\"k\" hint-placeholder-count=\"1\">\n                        <button type=\"button\" sc-camel-on-click=\"{{k.pick}}\" style=\"min-height: 44px; padding: 4px 10px; background: #ffffff; color: #18261F; border: 2px solid #18261F; border-radius: 10px; font: 400 13px/1.2 'Rubik', Arial, sans-serif; text-align: left; cursor: pointer\">{{k.label}}: <span style=\"font-weight: 600\">{{k.value}}<\u002Fspan><\u002Fbutton>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                  <div style=\"margin-top: auto; display: flex; flex-direction: column; gap: 3px; font-size: 13.5px; border-top: 2px solid #E7EFEA; padding-top: 8px; font-variant-numeric: tabular-nums\">\n                    <div style=\"display: flex; justify-content: space-between\"><span class=\"tip\"><button type=\"button\" class=\"tipbtn\" aria-describedby=\"{{c.tipId}}\">Reliability<span aria-hidden=\"true\" class=\"tipq\">?<\u002Fspan><\u002Fbutton><span role=\"tooltip\" id=\"{{c.tipId}}\" class=\"tipbox\" style=\"background: #18261F; color: #FFFDF6\">Reliability is how closely candidates' marks would repeat if they sat an equivalent assessment with different questions, cases or examiners. It is a number between 0 and 1, and 0.80 is often treated as the minimum for high-stakes decisions (van der Vleuten &amp; Schuwirth 2005). This figure is for this component alone.<\u002Fspan><\u002Fspan><span style=\"font-weight: 600\">{{c.rel}}<\u002Fspan><\u002Fdiv>\n                    <div style=\"display: flex; justify-content: space-between\"><span>Staff cost<\u002Fspan><span style=\"font-weight: 600\">{{c.cost}}<\u002Fspan><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{c.unused}}\" hint-placeholder-val=\"{{false}}\">\n                <button type=\"button\" sc-camel-on-click=\"{{c.add}}\" style=\"flex: 1; box-sizing: border-box; background: none; color: #F1FAF5; border: 2px dashed #8CCBB1; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-family: 'Rubik', Arial, sans-serif; cursor: pointer\">\n                  <span aria-hidden=\"true\" style=\"font-size: 34px; font-weight: 400; line-height: 1\">+<\u002Fspan>\n                  <span style=\"font-size: 17px; font-weight: 600\">{{c.addLabel}}<\u002Fspan>\n                  <span style=\"font-size: 13px; color: #C6E6D8\">{{c.long}}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-if>\n              <sc-if value=\"{{c.blocked}}\" hint-placeholder-val=\"{{false}}\">\n                <div style=\"flex: 1; box-sizing: border-box; border: 2px dashed #2E7A62; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; color: #C6E6D8\">\n                  <span style=\"font-size: 17px; font-weight: 600; color: #8CCBB1\">{{c.short}}<\u002Fspan>\n                  <span style=\"font-size: 13px; line-height: 1.4\">{{c.blockedNote}}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"flex: 1 1 300px; max-width: 350px; box-sizing: border-box; background: #0A4433; border-radius: 20px; padding: 20px 22px; display: flex; flex-direction: column; gap: 13px\">\n        <h2 style=\"margin: 0; font-size: 18px; font-weight: 600\">Utility<\u002Fh2>\n        <div style=\"display: flex; align-items: flex-end; gap: 12px\">\n          <div style=\"font-size: 92px; line-height: 0.85; font-weight: 800; letter-spacing: -0.04em; color: #FFD447; font-variant-numeric: tabular-nums\">{{u}}<\u002Fdiv>\n          <div style=\"font-size: 15px; color: #C6E6D8; line-height: 1.3\">out of 100<br><span style=\"font-weight: 800; color: #FFD447\">{{deltaNum}}<\u002Fspan> {{deltaRest}}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size: 14px; line-height: 1.35; font-weight: 600; color: {{gatesColor}}\">{{gatesText}}<\u002Fdiv>\n\n        <div style=\"display: flex; flex-direction: column; gap: 9px\">\n          <sc-for list=\"{{rows}}\" as=\"r\" hint-placeholder-count=\"5\">\n            <div style=\"display: flex; flex-direction: column; gap: 4px\">\n              <div style=\"display: flex; justify-content: space-between; gap: 8px; font-size: 15px; color: {{r.color}}\"><span style=\"font-weight: {{r.weight}}\"><sc-if value=\"{{r.isRel}}\" hint-placeholder-val=\"{{false}}\"><span class=\"tip\"><button type=\"button\" class=\"tipbtn\" aria-describedby=\"{{r.tipId}}\">{{r.name}}<span aria-hidden=\"true\" class=\"tipq\">?<\u002Fspan><\u002Fbutton><span role=\"tooltip\" id=\"{{r.tipId}}\" class=\"tipbox\" style=\"background: #FFFDF6; color: #18261F\">{{r.tipText}}<\u002Fspan><\u002Fspan><\u002Fsc-if><sc-if value=\"{{r.notRel}}\" hint-placeholder-val=\"{{true}}\">{{r.name}}<\u002Fsc-if> <span style=\"font-weight: 400; color: #C6E6D8\">{{r.w}}<\u002Fspan><\u002Fspan><span style=\"font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap\">{{r.valText}}<\u002Fspan><\u002Fdiv>\n              <div style=\"width: 180px; height: 14px; background: radial-gradient(circle at 7px 7px, #2E7A62 6px, rgba(0,0,0,0) 6.5px); background-size: 18px 14px\"><div style=\"width: {{r.pipW}}; height: 14px; background: radial-gradient(circle at 7px 7px, {{r.pip}} 6px, rgba(0,0,0,0) 6.5px); background-size: 18px 14px\"><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"margin-top: auto; display: flex; flex-direction: column; gap: 8px\">\n          <div style=\"display: flex; flex-direction: column; gap: 6px\">\n            <div style=\"display: flex; justify-content: space-between; gap: 12px; font-size: 15px\"><span>Cost<\u002Fspan><span style=\"font-weight: 600; font-variant-numeric: tabular-nums; color: {{spentColor}}\">{{spentText}}<\u002Fspan><\u002Fdiv>\n            <div style=\"height: 10px; background: #0F5B45; border-radius: 999px; overflow: hidden\"><div style=\"height: 10px; width: {{spentWidth}}; background: {{spentBar}}; border-radius: 999px\"><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; justify-content: space-between; font-size: 15px\"><span>Wrong pass or fail decisions<\u002Fspan><span style=\"font-weight: 600; font-variant-numeric: tabular-nums\">{{wrongText}}<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: flex; flex-direction: column; gap: 8px\">\n      <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px\">\n        <h2 style=\"margin: 0; font-size: 18px; font-weight: 600\">Settings<\u002Fh2>\n        <div style=\"font-size: 14px; color: #C6E6D8\">Press a setting to move it to its next option. After the last option, it returns to the first.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px\">\n        <sc-for list=\"{{rules}}\" as=\"k\" hint-placeholder-count=\"7\">\n          <button type=\"button\" sc-camel-on-click=\"{{k.pick}}\" style=\"flex: none; width: {{k.w}}; white-space: nowrap; text-align: left; min-height: 44px; padding: 0 16px; background: #FFFDF6; color: #18261F; border: none; border-radius: 999px; font: 400 15px 'Rubik', Arial, sans-serif; cursor: pointer\">{{k.label}}: <span style=\"font-weight: 600\">{{k.value}}<\u002Fspan><\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"background: #0A4433; border-radius: 14px; padding: 8px 16px 12px; display: flex; flex-direction: column; gap: 6px\">\n        <div role=\"group\" aria-label=\"Explain a setting\" style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 0 16px; font-size: 14.5px\">\n          <span style=\"color: #C6E6D8\">What the settings mean:<\u002Fspan>\n          <sc-for list=\"{{explainTabs}}\" as=\"x\" hint-placeholder-count=\"7\">\n            <button type=\"button\" sc-camel-on-click=\"{{x.pick}}\" aria-pressed=\"{{x.pressed}}\" style=\"min-height: 44px; background: none; border: none; padding: 0; font-family: 'Rubik', Arial, sans-serif; font-size: 14.5px; font-weight: {{x.weight}}; color: #F1FAF5; text-decoration: underline; text-decoration-thickness: {{x.thick}}; text-underline-offset: 5px; cursor: pointer\">{{x.label}}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{hasExplain}}\" hint-placeholder-val=\"{{false}}\">\n          <div style=\"display: flex; flex-direction: column; gap: 5px; max-width: 96ch\">\n            <div style=\"font-size: 16px; font-weight: 600\">{{explainTitle}}<\u002Fdiv>\n            <sc-for list=\"{{explainRows}}\" as=\"e\" hint-placeholder-count=\"3\">\n              <div style=\"font-size: 14.5px; line-height: 1.45\"><span style=\"font-weight: 600; color: {{e.color}}\">{{e.opt}}<\u002Fspan> {{e.text}}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 28px; border-top: 2px solid #0A4433; padding-top: 12px\">\n      <div style=\"flex: 1 1 460px; display: flex; flex-direction: column; gap: 4px; max-width: 78ch\">\n        <div style=\"font-size: 15px; line-height: 1.4\"><span style=\"font-weight: 600\">{{evTitle}}<\u002Fspan> {{evText}} <span style=\"color: #C6E6D8\">{{evSource}}<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 10px\">\n        <button type=\"button\" sc-camel-on-click=\"{{reset}}\" style=\"min-height: 44px; padding: 0 18px; background: none; color: #F1FAF5; border: 2px solid #F1FAF5; border-radius: 999px; font: 600 15px 'Rubik', Arial, sans-serif; cursor: pointer\">Start this brief again<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{submit}}\" style=\"min-height: 52px; padding: 0 30px; background: #FF8A66; color: #18261F; border: none; border-radius: 999px; font: 800 18px 'Rubik', Arial, sans-serif; cursor: pointer; box-shadow: 0 6px 0 #0A4433\">Submit to the board<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{isBoard}}\" hint-placeholder-val=\"{{false}}\">\n  <div style=\"flex: 1; display: flex; flex-wrap: wrap; gap: 20px 28px\">\n\n    <div style=\"flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n      <div style=\"font-size: 16px; color: #C6E6D8\">The board's verdict<\u002Fdiv>\n      <h1 style=\"margin: 0; font-size: 72px; line-height: 0.95; font-weight: 800; letter-spacing: -0.03em; color: {{verdictColor}}; text-wrap: balance\">{{verdict}}<\u002Fh1>\n      <p style=\"margin: 0; font-size: 17px; line-height: 1.45; max-width: 66ch\">{{verdictLine}} <span style=\"color: #C6E6D8\">{{verdictScale}}<\u002Fspan><\u002Fp>\n\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(290px, 100%), 1fr)); gap: 14px\">\n        <sc-for list=\"{{members}}\" as=\"m\" hint-placeholder-count=\"4\">\n          <div style=\"background: #FFFDF6; color: #18261F; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 6px 0 #0A4433\">\n            <h3 style=\"margin: 0; font-size: 15px; font-weight: 600\">{{m.role}}<\u002Fh3>\n            <p style=\"margin: 0; font-size: 15px; line-height: 1.45\">{{m.text}}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{hasEvent}}\" hint-placeholder-val=\"{{false}}\">\n        <div style=\"background: #FF8A66; color: #18261F; border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 6px 0 #0A4433\">\n          <div style=\"font-size: 24px; font-weight: 800; letter-spacing: -0.01em\">{{eventTitle}}<\u002Fdiv>\n          <p style=\"margin: 0; font-size: 15px; line-height: 1.45; max-width: 74ch\">{{eventText}} {{eventBefore}}<\u002Fp>\n          <div>\n            <button type=\"button\" sc-camel-on-click=\"{{clearEvent}}\" style=\"min-height: 44px; padding: 0 18px; background: #18261F; color: #FFFDF6; border: none; border-radius: 999px; font: 600 15px 'Rubik', Arial, sans-serif; cursor: pointer\">Remove this event<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"flex: 1 1 320px; max-width: 390px; box-sizing: border-box; background: #0A4433; border-radius: 20px; padding: 20px 22px; display: flex; flex-direction: column; gap: 12px\">\n      <h2 style=\"margin: 0; font-size: 18px; font-weight: 600\">Pass and fail decisions<\u002Fh2>\n      <div role=\"img\" aria-label=\"Simulated candidates plotted by true competence and by mark\" style=\"position: relative; height: 240px; background: #0F5B45; border-radius: 12px; overflow: hidden\">\n        <div aria-hidden=\"true\" style=\"position: absolute; left: {{tcutLeft}}; top: 0; width: 0; height: 100%; border-left: 2px dashed #F1FAF5\"><\u002Fdiv>\n        <div aria-hidden=\"true\" style=\"position: absolute; left: {{tcutLeft}}; top: 6px; margin-left: 6px; font-size: 12px; color: #F1FAF5\">competence needed<\u002Fdiv>\n        <div aria-hidden=\"true\" style=\"position: absolute; right: 8px; top: {{xcutTop}}; margin-top: -18px; font-size: 12px; color: #F1FAF5; display: {{xcutShow}}\">pass mark<\u002Fdiv>\n        <div aria-hidden=\"true\" style=\"position: absolute; left: 0; top: {{xcutTop}}; width: 100%; height: 0; border-top: 2px dashed #F1FAF5; display: {{xcutShow}}\"><\u002Fdiv>\n        <sc-for list=\"{{dots}}\" as=\"p\" hint-placeholder-count=\"3\">\n          <div style=\"position: absolute; left: {{p.l}}; top: {{p.t}}; width: {{p.s}}; height: {{p.s}}; margin: -3px 0 0 -3px; border-radius: 50%; background: {{p.bg}}; opacity: {{p.op}}\"><\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display: flex; justify-content: space-between; font-size: 13px; color: #C6E6D8\"><span>Across: true competence<\u002Fspan><span>Up: mark awarded<\u002Fspan><\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 6px; font-size: 15px\">\n        <div style=\"display: flex; justify-content: space-between\"><span><span aria-hidden=\"true\" style=\"display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #FF8A66; margin-right: 8px\"><\u002Fspan>False passes<\u002Fspan><span style=\"font-weight: 600; font-variant-numeric: tabular-nums\">{{fp}}<\u002Fspan><\u002Fdiv>\n        <div style=\"display: flex; justify-content: space-between\"><span><span aria-hidden=\"true\" style=\"display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #FFD447; margin-right: 8px\"><\u002Fspan>False fails<\u002Fspan><span style=\"font-weight: 600; font-variant-numeric: tabular-nums\">{{fn}}<\u002Fspan><\u002Fdiv>\n        <div style=\"display: flex; justify-content: space-between\"><span>Candidates who fail<\u002Fspan><span style=\"font-weight: 600; font-variant-numeric: tabular-nums\">{{failsText}}<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin: 0; font-size: 13px; line-height: 1.4; color: #C6E6D8\">Each dot is a simulated candidate, and false passes are the dots left of the competence line and above the pass mark. The counts are averages over many simulated cohorts, so they can differ slightly from the dots.<\u002Fp>\n      <button type=\"button\" sc-camel-on-click=\"{{backToDesign}}\" style=\"margin-top: auto; min-height: 52px; background: #FFD447; color: #18261F; border: none; border-radius: 999px; font: 800 17px 'Rubik', Arial, sans-serif; cursor: pointer\">Back to the design<\u002Fbutton>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1366,&quot;height&quot;:980} }\">\nclass Component extends DCLogic {\ngetModel() {\nif (this._m) return this._m;\n/* Assessment design model. Pure functions, shared by the page and the Node tests. */\nvar PARAMS = {\n  rate: 140,                 // clinician (consultant) time, GBP per working hour (PSSRU Unit Costs 2025, cost year 2024/25)\n  rateSL: 49,                // senior lecturer time: spine point 43, top of grade 8 (GBP 57,666 from August 2026, Stirling), with the same on-cost ratio as spine point 38 (63,986 / 49,798 = x 1.285) / 1,526.4 workload hours = about GBP 48.50\n  rateAcad: 42,              // lecturer time: spine point 38 with on-costs, GBP 63,986 (Exeter 2026) / 1,526.4 workload hours (St Mary's)\n  rateAdmin: 28,             // administrator time: spine point 24 (GBP 33,662) with the same on-cost ratio / 1,526.4 h\n  invigRate: 14.12, chiefRate: 17.24, invigRatio: 40, invigExtraH: 1, // Newcastle 2025 rates; 1 invigilator per 40 (LJMU); setup time estimated\n  printPerHead: 4,           // stationery per candidate per sitting (Brown et al. 2015: GBP 757 for 185 OSCE candidates)\n  sbaR1: 0.62,               // reliability of 1 h of multiple choice (van der Vleuten & Schuwirth 2005, Table 1)\n  vsaqR1: 0.62,              // assumed equal to SBA per hour\n  essayErr1: 1.5,            // error variance for 1 h of essay/SAQ, single marker => reliability 0.40 (assumed)\n  essayMarkerShare: 0.50,    // share of essay error from the marker; inter-marker kappa 0.12-0.39 (Smith 2002; Anatol 2009)\n  vivaPC: 0.518, vivaSE: 1.04, vivaRES: 0.222, // per 30-minute case; reproduces Swanson 1987 (0.45 / 0.69 / 0.82) and van der Vleuten & Schuwirth 2005 (2 h 0.69, 4 h 0.82)\n  vivaUnstructured: 1.5,     // multiplier on examiner-related error when unstructured (assumed)\n  portA: 1.277, portB: 1.973,// fitted to Michels et al. 2009\n  constructCorr: 0.3,        // correlation between the four abilities (assumed)\n  sbaPerH: 50, vsaqPerH: 40, essayPerH: 4,\n  sbaWriteH: 0.87,           // first draft of one question: 52 min (Meazure Learning, 75 writers); no evidence that training changes drafting time\n  kfR1: 0.324,               // 1 h of key-features cases, write-in; reproduces van der Vleuten & Schuwirth 2005 Table 1 (0.32 / 0.49 / 0.66 / 0.79 for 1 / 2 / 4 / 8 h), from Hatala & Norman 2002: 2 h, 15 cases, alpha 0.49\n  kfPerH: 8,                 // cases per hour (Hatala & Norman 2002: 15 cases in 2 h; Medical Council of Canada 2019 report: 38 cases in up to 3.5 h)\n  kfQsPerCase: 2.5,          // 2-3 questions per case (Norman et al. 2006; Toronto CDM guide)\n  kfWriteH: 2,               // estimate: no source found for the time to write a key-features case\n  vsaqWriteH: 0.87,          // assumed equal to SBA; reviewing the machine-marked answers took 1 min 36 s per question for all students (Sam et al. 2018)\n  essayWriteH: 2,            // estimate: no source found\n  writerTrainH: 1.5,         // item-writing training session: about 90 minutes (course lead's experience)\n  qsPerWriterYear: 30,       // estimate: a trained writer writes about 30 questions a year across all the school's assessments, so this exam carries 1/30 of the training per question\n  reviewPanel: 5, reviewMin: 5, // review panel: about 5 people spend about 5 minutes on each question (course lead's experience)\n  vivaCaseH: 5,              // structured case: 4 h writing + 1 h review (Brown et al. 2015, OSCE station analogue)\n  vsaqMarkSec: 1.25,         // seconds per candidate per question, clinician time (Sam et al. 2019)\n  essayMarkMin: 15,          // marker minutes per candidate per hour of essay paper (Sussex and Nottingham marking tariffs)\n  vivaCaseMin: 32,           // 30-minute case (matches Swanson's four cases to the 2 h of oral testing in van der Vleuten & Schuwirth 2005) + 2 minutes changeover (FFICM Final SOE)\n  vivaAdminH: 0.3,           // admin hours per candidate per sitting (Brown et al. 2015: 55.5 h for 185 candidates)\n  portMarkMin: 12,           // assessor minutes per entry per rater (Michels et al. 2009: 181 min per 15 tasks)\n  portStudentH: 7.6,         // student hours per entry (Michels et al. 2009)\n  mentorH: 1,                // two 30-minute meetings (one-to-one meeting length, UiT; 3-5 meetings a year, Maastricht)\n  platform: 11,              // e-portfolio licence per student (PebblePad quote, about GBP 11,000 per 1,000 licences)\n  blueprintH: 2,             // 1-2 hours (MedEdPORTAL 2013, authors' experience)\n  angoffJudges: 15, angoffMinItem: 0.75, angoffTrainH: 0.6, angoffEssayMin: 5, // about 15 judges (Shulruf 2016); 0.5-0.9 min per item and 35 min training in published panels; essay time estimated\n  analysisH: 2.67,           // formatting and analysis per written exam sitting (Mandel et al. 2011)\n  boardH: 25.5,              // exam board: 17 staff for 1.5 h (Brown et al. 2015)\n  trainH: 1,                 // per examiner or marker (Brown et al. 2015)\n  biasReviewH: 8,            // estimate: no source found\n  profileH: 3, feedbackMin: 5, reuseShare: 0.4, // profile time estimated; 5 min per written comment (estimate); exams in one Canadian programme contained 25-60% reused items (Joncas et al. 2018)\n  cwT: 1.277,                // coursework essay: error from the topic, per essay. Borrowed from one portfolio entry (Michels et al. 2009); no study separates this for coursework essays, so it is an estimate\n  cwM: 4.23,                 // error per marker per essay, from a correlation of 0.35 between two markers of the same work: (1 + cwT)(1 / 0.35 - 1). Project reports: r 0.24-0.36 (Yeo et al. 2024), 0.28 (McKinstry et al. 2004)\n  cwMarkMin: 30,             // lecturer minutes to mark a 2,000-word essay (University of Sussex tariff: \"Essays/exam scripts ~2000 words - 30 mins each\")\n  cwModShare: 0.10, cwModH: 2, // single marking: a moderator re-reads all fails plus a 5% sample (University of Southampton policy, 2025), about 10% of essays; the 2-hour meeting is an estimate\n  cwStudentH: 16,            // estimate: student hours to write a 2,000-word essay (no source we could read)\n  cwDraftMin: 20,            // estimate: lecturer minutes to read a draft and write comments\n  cwSetupH: 3,               // estimate: hours to write the essay brief, rubric and marker guidance\n  cwCiv: 0.40, cwCivViva: 0.30, // assumption: unsupervised writing adds construct-irrelevant variance (Scarfe et al. 2024: 94% of AI-written submissions went undetected); a viva on the work checks authorship\n  cutShift: [-0.40, 0.20, 0.10] // fixed 50% is lenient when items average 70-80% correct (Joncas et al. 2018; Appelhaus et al. 202 tion and Curricular Development', ' 11:23821205241277337.', 'Yeo et al. 2024', 'correlations of 0.36 (analytic rubric) and 0.24 (holistic rubric) between two markers of the same project manuscripts.', [doi('10.1177/23821205241277337')]),\nR('Smith B, Sinclair H, Simpson J, van Teijlingen E, Bond C, Taylor R (2002).', 'What is the role of double-marking? Evidence from an undergraduate medical course. ', 'Education for Primary Care', ' 13(4):497–503.', 'Smith et al. 2002', 'weak agreement between two markers of the same third-year community course essays (kappa 0.12).', [['Record', 'https://discovery.dundee.ac.uk/en/publications/what-is-the-role-of-double-marking-evidence-from-an-undergraduate/']]),,\nR('University of Southampton (2025).', 'Double-blind marking and moderation policy. Last updated June 2025.', '', '', 'University of Southampton marking policy', 'a moderation sample of all fails plus 5% of the other work when an essay is marked once.', [['PDF', 'https://www.southampton.ac.uk/~assets/doc/quality-handbook/Double-Blind%20Marking%20and%20Moderation%20Policy.pdf']]),\nR('Wisniewski B, Zierer K, Hattie J (2020).', 'The power of feedback revisited: a meta-analysis of educational feedback research. ', 'Frontiers in Psychology', ' 10:3087.', 'Wisniewski et al. 2020', 'an overall effect of feedback on learning of about half a standard deviation (d = 0.48, 435 studies).', [doi('10.3389/fpsyg.2019.03087')]),\nR('Ghazal L, Aijaz A, Parpio Y, Tharani A, Gul RB (2018).', 'Feed-forward: paving ways for students\\' subsequent learning. ', 'Nurse Education Today', ' 71:116–120.', 'Ghazal et al. 2018', 'higher marks when nursing students had comments on a draft rather than on an outline.', [doi('10.1016/j.nedt.2018.09.010')])\n] },\n{ title: 'Essays written by AI and AI detectors', refs: [\nR('Scarfe P, Watcham K, Clarke A, Roesch E (2024).', 'A real-world test of artificial intelligence infiltration of a university examinations system: a \"Turing Test\" case study. ', 'P ).', 'AI-written admissions essays are widespread but penalized. ', 'arXiv preprint', ' 2609.22549.', 'Isley et al. 2026', 'the finding that, on admissions essays written before ChatGPT existed, two detectors gave their most confident AI label to at most 0.3% of essays, and flagged international applicants no more often than others. One detector company gave the authors free access to its detector.', [['arXiv', 'https://arxiv.org/abs/2609.22549']]),\nR('Karr JA Jr, Khvatskii G, Hua T, Chawla NV (2026).', 'Why AI detection fails for academic integrity. ', 'arXiv preprint', ' 2608.11256 (accepted to the ACM AI Leadership Summit).', 'Karr et al. 2026', 'the finding that after a humaniser (software sold to make AI writing look human) rewrote AI-written abstracts, Pangram and GPTZero missed more than 96% of them, and that Pangram flagged 64 to 80% of abstracts that had only been lightly edited with AI. One detector company let the authors use its detector.', [['arXiv', 'https://arxiv.org/abs/2608.11256']]),\nR('Webb M, Jisc National Centre for AI (2025).', 'AI detection and assessment: an update for 2025. Blog post, 24 June 2025.', '', '', 'Jisc 2025', 'UK sector guidance that decisions should never be based solely on AI detection.', [['Link', 'https://nationalcentreforai.jiscinvolve.org/wp/2025/06/24/ai-detection-assessment-2025/']])\n] },\n{ title: 'Written questions', refs: [\nR('Sam AH, Westacott R, Gurnell M, Wilson R, Meeran K, Brown C (2019).', 'Comparing single-best-answer and very-short-answer questions for the assessment of applied medical knowledge in 20 UK medical schools: cross-sectional study. ', 'BMJ Open', ' 9:e032550.', 'Sam et al. 2019', 'how very short answer questions work, the gap in marks between the two formats, and the time to mark very short answer questions (1.25 seconds of clinician time per student per question).', [doi('10.1136/bmjopen-2019-032550')]),\nR('Sam AH, Field SM, Collares CF, van der Vleuten CPM, Wass VJ, Melville C, Harris J, Meer
