ndecLabel: STEPS[ckey][0], incLabel: STEPS[ckey][1],\ndec: function () { self.change(key, Math.max(0, v - step)); },\ninc: function () { if (v < max) self.change(key, Math.min(max, v + step)); },\nadd: function () { self.change(key, start); }, addLabel: 'Add ' + addName,\nremove: function () { self.change(key, 0); }, removeLabel: ckey === 'cw' ? 'Remove all the coursework essays' : 'Remove ' + the,\nhasChips: chips.length > 0, chips: chips,\ntipId: 'tip-rel-' + ckey, rel: c ? f2(c.rel) : '', share: c ? SHARE[ckey] + '%' : '', cost: money(cost[ckey])\n};\n}\nvar slots = [\nslot(0, 'sbaH', 'sba', 'SBA paper', 'Single best answer questions', 'an SBA paper', ' h', null, 4, 0.5, 1, []),\nslot(1, 'vsaqH', 'vsaq', 'VSAQ paper', 'Very short answer questions', 'a VSAQ paper', ' h', null, 4, 0.5, 1, []),\nslot(2, 'kfH', 'kf', 'KF paper', 'Key-features cases, about 8 an hour', 'a KF paper', ' h', null, 4, 0.5, 1, [cyc('kfMenu', 'Answers', [[false, 'marked by a clinician'], [true, 'matched by computer']])]),\nslot(3, 'essayH', 'essay', 'Timed essay paper', 'Four short essays per hour, in an exam', 'a timed essay paper', ' h', null, 4, 0.5, 1, [cyc('essayMark', 'Markers per script', [[1, '1'], [2, '2']])]),\nslot(4, 'vivaCases', 'viva', 'Viva', '30 minutes per case', 'a viva', null, ['case', 'cases'], 12, 1, 2, [\ncyc('vivaExam', 'Examiners per case', [[1, '1'], [2, '2'], [3, '3']]),\ncyc('vivaRotate', 'Examiners', [[false, 'same for every case'], [true, 'new for each case']]),\ncyc('vivaStruct', 'Questions', [[false, 'unstructured'], [true, 'structured']])]),\nslot(5, 'portEntries', 'port', 'Portfolio', 'Written entries over the course', 'a portfolio', null, ['entry', 'entries'], 15, 1, 4, [\ncyc('portRaters', 'Raters per entry', [[1, '1'], [2, '2'], [3, '3']]),\ncyc('mentor', 'Mentor meetings', [[false, 'none'], [true, '1 hour each']])]),\nslot(6, 'cwN', 'cw', 'Coursework essay', 'About 2,000 words on the student\\'s own topic', 'a coursework essay', null, ['essay', 'essays'], 3, 1, 1, [\ncyc('cwMark', 'Markers per essay', [[1, '1'], [2, '2']]),\ncyc('cwDraft', 'Draft feedback', [[false, 'none'], [true, 'one draft']]),\ncyc('aiDetect', 'AI detector', [[false, 'none'], [true, 'software checks every essay']])])\n];\nvar rules = [\ncyc('itemQuality', 'Question writing', [[0, 'untrained writers, no review'], [1, 'trained writers'], [2, 'trained writers and a review panel']]),\ncyc('blueprint', 'Blueprint', [[0, 'none'], [1, 'for examiners only'], [2, 'shared with candidates']]),\ncyc('stdset', 'Pass mark', [[0, 'fixed at 50%'], [1, 'Cohen method'], [2, 'Angoff panel']]),\ncyc('rule', 'Pass rule', [[0, 'combined mark'], [1, 'pass every component']]),\ncyc('sittings', 'Sittings', [[1, 'one'], [2, 'two across the year'], [4, 'four across the year']]),\ncyc('feedback', 'Feedback', [[0, 'mark only'], [1, 'profile by domain'], [2, 'individual written feedback']]),\ncyc('fairness', 'Examiner training', [[false, 'none'], [true, 'training and bias review']])\n];\n\nvar EV = {\nsbaH: ['One hour of multiple-choice testing has reliability 0.62. Each additional hour raises reliability by less than the hour before it.', 'van der Vleuten & Schuwirth 2005'],\nkfH: ['A key-features case is a short clinical scenario followed by two or three questions about the critical decisions only. A 2-hour paper of 15 cases had reliability 0.49, which corresponds to 0.32 for one hour, about half the reliability of an hour of single best answer questions. Scores on key-features papers correlate only modestly with knowledge tests, so the papers measure something partly different. The model charges 2 hours of clinician time to write each case. No study we found measured this time, so it is an estimate.', 'Page, Bordage & Allen 1995; Hatala & Norman 2002; van der Vleuten & Schuwirth 2005; Hrynchak et al. 2014'],\nkfMenu: ['Candidates can type an answer that the computer matches against a long list of accepted terms, instead of writing an answer for a clinician to mark. In a randomised trial, students got the same marks and took the same time with either format, about 100 seconds a question. The long list removes the cost of marking.', 'Rotthoff et al. 2006'],\nvsaqH: ['Candidates write an answer of one to five words instead of choosing from a list. On the same questions, single best answer marks were 21 percentage points higher.', 'Sam et al. 2019'],\nessayH: ['Only about four essay questions fit in an hour, so a timed essay paper samples little of the curriculum. In this model, one hour of essays with one marker has reliability 0.40.', 'Assumption in this model'],\nessayMark: ['When two markers marked the same final-year surgery examination answers, they agreed only weakly (kappa 0.39). In this model a second marker raises the reliability of one hour of essays from 0.40 to 0.47 and doubles the cost of marking. How much of the error in an essay mark comes from the marker is an assumption of this model.', 'Anatol & Hariharan 2009'],\ncwN: ['Each student writes an essay of about 2,000 words on their own topic during the term. When two markers marked the same medical students\\' project reports, their marks correlated only 0.24 to 0.36, and in a study of third-year community course essays the two markers agreed even less (kappa 0.12). A student\\'s mark also depends on the topic they chose, as it does for a portfolio entry. The model assumes that the topic matters as much for an essay as for a portfolio entry. In this model one essay marked once has reliability 0.15, and three essays each marked twice reach 0.47. The model counts 16 hours of writing for each essay, which is also an estimate. Students write coursework outside the exam, so these hours do not count towards the brief\\'s limit on testing time.', 'Yeo et al. 2024; McKinstry et al. 2004; Smith et al. 2002; Michels et al. 2009'],\ncwMark: ['When supervisors marked their own students\\' project reports, their marks were about half a grade higher than those of second markers. A second marker halves the error that comes from the marker, which raises the reliability of one essay from 0.15 to 0.23, but it doubles the time spent marking. Marking a 2,000-word essay takes about 30 minutes. With one marker, a moderator also re-reads every fail and a 5% sample of the other essays.', 'McKinstry et al. 2004; University of Sussex marking tariff; University of Southampton marking policy'],\naiDetect: ['Some schools run every essay through an AI detector, software that claims to recognise writing produced by AI. A detector gives each essay a score from 0 to 100% for how strongly it judges the essay to be written by AI, and some detectors also give each essay a label, such as human, mixed or AI. An essay is flagged when its score or label suggests that AI wrote it. Early detectors were unreliable. In 2023, an independent test of 14 detectors found them neither accurate nor reliable, and seven detectors labelled on average 61% of essays by non-native English speakers as written by AI. The paid detectors tested independently in 2026 make far fewer false accusations against writing that is entirely human. In one 2026 study, four detectors flagged none of 40 master\\'s theses by non-native English-speaking students. In another, on admissions essays written before ChatGPT existed, two detectors gave their most confident AI label to at most 0.3% of essays. But detectors differ widely in what they catch. In the first of these studies, Pangram gave 39 of 40 long papers written entirely by AI a score of 60% or more, while Turnitin gave all 40 a score of 20% or less. Rewriting software can still defeat the best detectors. After a humaniser, which is software sold to make AI writing look human, rewrote AI-written abstracts, Pangram and GPTZero missed more than 96% of them. Detectors also flag work that students have only polished with AI, which a course may allow, so a flag cannot show on its own that a student broke the rules. Jisc, which advises UK universities and colleges on digital technology, says that decisions should never rest on AI detection alone. In this model, the detector affects validity only when the board finds essays written by AI and the design has no viva. Validity then falls by 10% instead of 15%. Whenever the design uses a detector, acceptability is also 0.05 lower, because each flag needs investigating and a detector cannot tell allowed AI editing from AI-written work. Both effects are assumptions. The model charges nothing for the licence or for investigating flagged essays.', 'Weber-Wulff et al. 2023; Liang et al. 2023; Van Vlasselaer et al. 2026; Isley et al. 2026; Karr et al. 2026; Jisc 2025'],\ncwDraft: ['The supervisor reads one draft and writes comments before the student submits the final essay. A meta-analysis of 435 studies found that feedback improved learning by about half a standard deviation, and in one study nursing students who had comments on a draft got higher marks than students who had comments on an outline. The model charges 20 minutes of lecturer time for each draft, which is an estimate.', 'Wisniewski et al. 2020; Ghazal et al. 2018'],\nvivaCases: ['An oral examination had reliability 0.69 for 2 hours and 0.82 for 4 hours of testing. In this model each case lasts 30 minutes, and each case costs 32 minutes of each examiner\\'s time per candidate, including 2 minutes of changeover.', 'van der Vleuten & Schuwirth 2005; Faculty of Intensive Care Medicine (FFICM) structured oral examination timings'],\nvivaExam: ['A second examiner on a case reduces the error that comes from examiners, but not the error that comes from the choice of case. When each case has a new examiner, the same examiner time spent on extra cases reduces both.', 'Model fitted to Swanson 1987'],\nvivaRotate: ['With four cases, reliability was 0.45 when one examiner assessed every case and 0.69 when a different examiner assessed each case. With eight cases and a new examiner for each it was 0.82. This model reproduces all three figures.', 'Swanson 1987, in Davis & Karunathilake 2005'],\nvivaStruct: ['Published reliabilities for structured orals are 0.65 to 0.88. When six experienced examiners each marked the same videotaped mock orals on their own, their agreement was 0.24.', 'Swing & Bashook 2000, in Davis & Karunathilake 2005; Jacobsohn et al. 2006'],\nportEntries: ['A portfolio of 15 entries with two raters had reliability 0.87. The study estimated reliability 0.80 for 9 entries with two raters, or 13 entries with one. Students estimated 7.6 hours of writing per entry.', 'Michels et al. 2009'],\nportRaters: ['Raters took about 3 hours to rate a portfolio of 15 entries, which this model divides into 12 minutes per entry. Adding entries raises reliability more than adding raters per entry.', 'Michels et al. 2009'],\nmentor: ['Two reviews linked the success of portfolios to support from a mentor, and one concluded that tutor support is essential. In this model a portfolio without a mentor adds nothing to educational impact.', 'Driessen et al. 2007; Tochel et al. 2009'],\nitemQuality: ['In one nursing department, 46% of 2,770 multiple-choice questions had a writing flaw and over 90% tested low cognitive levels (Tarrant et al. 2006). Subject-matter experts writing for a certification programme took an average of 52 minutes to draft one question (Meazure Learning). From the experience of the course lead who wrote this game, training is a 90-minute session and each writer writes about 30 questions a year across the school, so each question carries 3 minutes of training. From the same experience, a review panel of about 5 people spends about 5 minutes on each question, which is 25 minutes of senior lecturer time. Exams in one Canadian programme contained 25 to 60% reused questions (Joncas et al. 2018), so the model charges for 60% of the questions as new.', 'Tarrant et al. 2006; Meazure Learning; Joncas et al. 2018; course lead\\'s experience'],\nblueprint: ['A blueprint maps each question to the curriculum. Experienced authors put the time to draw one up at 1 to 2 hours, and the model charges 2 hours of lecturer time for it. Sharing the blueprint with candidates costs nothing more. This model lowers validity by 10% when there is no blueprint, and raises educational impact by 0.05 when candidates can see it. No study we found measures either effect, so both figures are estimates.', 'Reznich & Wagner 2013'],\nstdset: ['Questions on medical school papers are answered correctly 70 to 80% of the time on average, so a fixed 50% pass mark is lenient and passes too many candidates. The Cohen method follows the marks of the best candidates, but its pass mark moved by 3.5 to 4 points between two years, although the two papers were of similar difficulty. In the Angoff method judges rate every question, and a simulation study found that panels of about 15 judges gave the most precise pass marks.', 'Joncas et al. 2018; Appelhaus et al. 2022; Homer & Darling 2016; Shulruf et al. 2016'],\nrule: ['When candidates must pass every component, measurement error in any one component can fail a competent candidate. The board shows the effect as false passes and false fails. The pass rule does not change the utility score.', 'Result of this model'],\nsittings: ['In a meta-analysis of 222 classroom studies, students who were tested did about half a standard deviation better than students in comparison conditions such as restudying.', 'Yang et al. 2021'],\nfeedback: ['In one interview study, students made little use of feedback after summative assessment, so the model gives feedback a smaller gain in a high-stakes brief. Feedback from an unreliable result is less useful, so the gain also shrinks when reliability is below 0.70. Individual feedback releases the questions, so none of them can be reused the next year.', 'Harrison et al. 2015; Joncas et al. 2018'],\nfairness: ['A randomised trial of rater training found no significant gain in agreement between raters, so the model leaves reliability unchanged. Instead, the model assumes that candidates and external examiners are more willing to accept a design in which examiners are trained and questions are reviewed for bias, so it raises acceptability.', 'Cook et al. 2009']\n};\nEV.mSba = EV.mVsaq = EV.mKf = EV.mEssay = EV.mViva = EV.mPort = EV.mCw = ['A component\\'s share of marks sets how much its measurement error affects the final mark. Giving a large share to a short or unreliable component lowers the reliability of the combined mark, and giving a share to a component that measures what the brief needs raises validity.', 'Result of this model'];\nvar evNote = s.lastKey && EV[s.lastKey] ? EV[s.lastKey] : ['Add a component, or change a setting, and the evidence for that change appears here.', ''];\n\nvar uNow = Math.round(o.U), deltaNum = '', deltaRest = 'This is the utility before you change anything.';\nif (po) { deltaNum = sign(uNow - Math.round(po.U)); deltaRest = 'compared with your saved design'; }\nelse if (s.lastDelta !== null) { deltaNum = sign(s.lastDelta); deltaRest = 'since your last change'; }\nvar notMet = o.gates.filter(function (g) { return !g.ok; }).map(function (g) { return g.fail; });\nvar listed = notMet.length < 2 ? notMet.join('') : notMet.slice(0, -1).join(', ') + ' and ' + notMet[notMet.length - 1];\nvar rows = ['R', 'V', 'E', 'A', 'C'].map(function (c) {\nvar low = o.weakest === c && !o.empty;\nvar TIP = { R: 'Reliability is how closely candidates\\' marks would repeat if they sat an equivalent assessment with different questions, cases or examiners. It is a number between 0 and 1, and 0.80 is often treated as the minimum for high-stakes decisions (van der Vleuten & Schuwirth 2005). This figure is for the combined mark.', V: 'Validity is the extent to which an assessment measures the competence it claims to measure (Schuwirth & van der Vleuten, in Swanwick et al. 2019). In this model it is the share of the real differences between candidates\\' marks tha ny questions each part of the curriculum receives. It makes the assessment sample the curriculum in proportion to the importance of each part.', opts: [\n[0, 'None', 'Questions are chosen without a plan of what the assessment should cover.'],\n[1, 'For examiners only', 'The assessment follows a blueprint, but candidates do not see it.'],\n[2, 'Shared with candidates', 'The assessment follows a blueprint, and candidates can see which topics and outcomes it covers. Sharing it costs nothing extra.'] ] },\nstdset: { title: 'Pass mark', intro: 'This setting chooses how the pass mark is set.', opts: [\n[0, 'Fixed at 50%', 'Candidates pass if their mark is at least half of the available marks, however hard or easy this year\\'s questions turn out to be.'],\n[1, 'Cohen method', 'The pass mark is 60% of the mark of the candidate at the 95th percentile, after a correction for guessing. Because it follows the marks of the best candidates, the pass mark falls when a paper turns out to be harder and rises when it turns out to be easier (Cohen-Schotanus & van der Vleuten 2010).'],\n[2, 'Angoff panel', 'Before the exam, a panel of judges estimates for each question the probability that a borderline candidate would answer it correctly. The pass mark is the sum of those estimates, averaged across the judges.'] ] },\nrule: { title: 'Pass rule', intro: '', opts: [\n[0, 'Combined mark', 'Candidates pass if their total across all components reaches the pass mark, so a strong component can make up for a weak one.'],\n[1, 'Pass every component', 'Candidates must reach the pass mark in each component separately, so a weak component cannot be made up elsewhere.'] ] },\nsittings: { title: 'Sittings', intro: 'The total amount of testing stays the same. Only the number of dates changes.', opts: [\n[1, 'One', 'All of the testing happens on one day.'],\n[2, 'Two across the year', 'Candidates sit half of the testing on each of two dates.'],\n[4, 'Four across the year', 'Candidates sit a quarter of the testing on each of four dates.'] ] },\nfeedback: { title: 'Feedback', intro: '', opts: [\n[0, 'Mark only', 'Candidates learn their mark and whether they passed.'],\n[1, 'Profile by domain', 'Candidates see how they did in each part of the blueprint.'],\n[2, 'Individual written feedback', 'A member of staff writes comments for each candidate.'] ] },\nfairness: { title: 'Examiner training', intro: '', opts: [\n[false, 'None', 'Examiners and markers receive no training, and nobody reviews the questions for bias.'],\n[true, 'Training and bias review', 'Examiners and markers are trained, and the questions are reviewed for content that could disadvantage a group of candidates.'] ] },\nkfMenu: { title: 'Key-features answers', intro: '', opts: [\n[false, 'Written in', 'Candidates write each answer, and clinicians mark the answers with software that groups identical ones.'],\n[true, 'Typed from a long list', 'Candidates type each answer, and the computer matches it against a long list of accepted terms, so nobody has to mark it.'] ] },\ncwMark: { title: 'Markers per coursework essay', intro: '', opts: [\n[1, 'One', 'Each essay is marked once, usually by the student\\'s supervisor, and a moderator re-reads every fail and a sample of the other essays.'],\n[2, 'Two', 'A second marker marks each essay independently, and the two marks are averaged.'] ] },\ncwDraft: { title: 'Feedback on a draft', intro: '', opts: [\n[false, 'None', 'Students submit their essay without comments on a draft.'],\n[true, 'One draft', 'The supervisor reads one draft and writes comments before the final essay is submitted.'] ] },\naiDetect: { title: 'AI detector', intro: '', opts: [\n[false, 'None', 'Essays are marked without software that claims to detect writing produced by AI.'],\n[true, 'Software checks every essay', 'Every essay is run through software that claims to detect writing produced by AI, and the markers see its verdict.'] ] },\nessayMark: { title: 'Markers per essay script', intro: ents', purpose: 'You are responsible for the written component of final examinations at a medical school. This year, 300 final-year students will sit it. A student who passes can graduate and begin work as a doctor, so the exam board must be able to defend every pass and every fail. ' },\nB: { tab: 'First-year SSC', who: '250 first-year medical students', purpose: 'You lead a student-selected component (SSC) in the first year of a medical degree. Each of the 250 students chooses a medical topic and studies it over the term with an academic supervisor. Because every student has a different topic, no common question paper can test what they have learned, and a different person marks each piece of work. Students must pass the SSC to progress, but they can resubmit, so the assessment should mostly measure how well students explain and defend what they have found, and how well they reflect on their own learning.' },\nC: { tab: 'PGCert module', who: '40 clinicians on a PGCert in Medical Education', purpose: 'You run a module on a PGCert in Medical Education, and its 40 students are practising clinicians who teach. The module assessment must show whether each of them can apply educational theory to their own teaching and reflect on what happened when they did. The result counts towards the award, so the combined mark needs a reliability of at least 0.65, although the stakes are lower than in a final examination.' },\nD: { tab: 'Sandbox', who: SX.cohort + ' candidates', purpose: 'You have described your own assessment. It has ' + SX.cohort + ' candidates and ' + SX.stakes + ' stakes, and you expect about ' + Math.round(SX.failRate * 100) + '% of them to fall short of the standard. The board checks your design against the budget, staff time and testing time that you set' + (SX.relGate ? ', and against the minimum reliability of ' + SX.relGate.toFixed(2) : '') + ', in the same way as for the other briefs.' }\n};\nvar slug = this.slugs()[id];\nvar GLOSS = {}; this.abilityText(
